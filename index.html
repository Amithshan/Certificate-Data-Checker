<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificate Data Validator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    th, td { border: 1px solid #dee2e6; padding: 0.6rem; white-space: nowrap; }
    thead th { position: sticky; top: 0; background-color: #343a40; color: white; }
    .invalid { background-color: #f8d7da !important; color: #721c24 !important; }
    .corrected { background-color: #d1e7dd !important; color: #0f5132 !important; }
    td[contenteditable="true"]:focus { outline: 2px solid #007bff; background-color: #e7f1ff; }
    #headerErrorBox { display:none; }
    #headerErrorBox ul { margin-bottom: 0; }
  </style>
</head>
<body>

<div class="container">
  <h4 class="mb-3">
    Certificate Data Validator
<div class="d-flex flex-wrap gap-2 my-3">
    <a href="https://docs.google.com/spreadsheets/d/1QoEN92c1SUm2kLIbrwgTmlBAoWQu_nID/export?format=xlsx"
       target="_blank"
       rel="noopener"
       class="btn btn-outline-danger px-4 py-2">
        <i class="bi bi-file-earmark-excel me-2"></i>
        Government Template
        <small class="d-block opacity-75">Excel (.xlsx)</small>
    </a>
    <a href="https://docs.google.com/spreadsheets/d/1szcZKqCfZJeQjRUEuHhH1JUfcDFSAcCm/export?format=xlsx"
       target="_blank"
       rel="noopener"
       class="btn btn-outline-primary px-4 py-2">
        <i class="bi bi-file-earmark-excel me-2"></i>
        Student Template
        <small class="d-block opacity-75">Excel (.xlsx)</small>
    </a>
</div>
  </h4>

  <!-- Metadata Inputs -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <label class="form-label">Start Date</label>
      <input type="date" id="startDate" class="form-control" />
    </div>
    <div class="col-md-3">
      <label class="form-label">End Date</label>
      <input type="date" id="endDate" class="form-control" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Venue</label>
      <select id="venueSelect" class="form-select">
        <option value="">-- Select Venue --</option>
        <option value="NILET, Makumbura (Virtual & Practical)">NILET, Makumbura (Virtual & Practical)</option>
        <option value="Regional Training Centre-NILET, Dambulla (Virtual and Practical)">Regional Training Centre-NILET, Dambulla (Virtual and Practical)</option>
        <option value="Training Centre-NILET, Agalawatta (Virtual and Practical)">Training Centre-NILET, Agalawatta (Virtual and Practical)</option>
        <option value="other">Other (Manual Input)</option>
      </select>
      <input type="text" id="venueManual" class="form-control mt-2 d-none" placeholder="Enter manual venue" />
    </div>
    <div class="col-md-3">
      <label class="form-label">File Number Prefix</label>
      <select id="filePrefix" class="form-select">
        <option value="">-- Select Prefix --</option>
        <option>NILET/TR/2026/CA/01/</option>
        <option>NILET/TR/2026/CA/02/</option>
        <option>NILET/TR/2026/CA/03/</option>
        <option>NILET/TR/2026/CA/04/</option>
        <option>NILET/TR/2026/CA/05/</option>
        <option>NILET/TR/2026/CA/06/</option>
        <option>NILET/AGA/TR/2026/CA/01/</option>
        <option>NILET/TR/2026/MA/01/</option>
        <option>NILET/TR/2026/MA/02/</option>
        <option>NILET/TR/2026/MA/03/</option>
        <option>NILET/TR/2026/MA/04/</option>
        <option>NILET/TR/2026/MA/05/</option>
        <option>NILET/TR/2026/MA/06/</option>
        <option>NILET/TR/2026/MA/07/</option>
        <option>NILET/TR/2026/MA/08/</option>
        <option>NILET/TR/2026/MA/09/</option>
        <option>NILET/TR/2026/MA/10/</option>
        <option>NILET/TR/2026/MA/11/</option>
        <option>NILET/TR/2026/MA/12/</option>
        <option>NILET/DB/TR/2026/MA/02/</option>
        <option>NILET/DB/TR/2026/MA/03/</option>
      </select>
    </div>
  </div>

  <!-- More Metadata Inputs -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <label class="form-label">Hours</label>
      <select id="hours" class="form-select">
        <option value="">-- Select Hours --</option>
        <option value="100">100</option>
        <option value="150">150</option>
        <option value="200">200</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Medium</label>
      <select id="medium" class="form-select">
        <option value="">-- Select Medium --</option>
        <option value="S">Sinhala</option>
        <option value="T">Tamil</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">File Number Suffix</label>
      <input type="text" id="fileSuffix" class="form-control" placeholder="e.g. 10" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Upload Excel</label>
      <input type="file" id="excelFile" class="form-control" accept=".xlsx,.xls" disabled />
    </div>
  </div>

  <!-- Header structure error -->
  <div id="headerErrorBox" class="alert alert-danger">
    <strong>⚠ Invalid file structure.</strong>
    <div id="headerErrorDetail" class="mt-2"></div>
    <div class="mt-2">
      Please use the
      <a href="https://docs.google.com/spreadsheets/d/1QoEN92c1SUm2kLIbrwgTmlBAoWQu_nID/export?format=xlsx" download>
        default template
      </a>
      and re-upload before finalizing certificate data.
    </div>
  </div>

  <!-- Table and Buttons -->
  <div class="table-responsive mb-3" style="max-height: 60vh;">
    <table id="excelTable" class="table table-bordered table-striped table-sm d-none" spellcheck="false">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="errorMessage" class="text-danger fw-semibold mb-3" style="display: none;"></div>
  <button class="btn btn-success" id="downloadExcel" style="display: none;">Download Corrected Excel</button>
</div>

<script>
  /* ============================================================
     Disable right-click + common DevTools shortcuts
     ============================================================ */
  // Disable right-click context menu
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    return false;
  });

  // Block common keyboard shortcuts used to open DevTools / view source
  document.addEventListener('keydown', function (e) {
    // F12
    if (e.key === 'F12' || e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C (DevTools)
    if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U (View Source)
    if (e.ctrlKey && e.key.toUpperCase() === 'U') {
      e.preventDefault();
      return false;
    }
    // Ctrl+S (Save page) - optional
    if (e.ctrlKey && e.key.toUpperCase() === 'S') {
      e.preventDefault();
      return false;
    }
  });

  // Disable text selection of non-editable areas (keeps contenteditable cells working)
  document.addEventListener('selectstart', function (e) {
    if (!e.target.isContentEditable) {
      e.preventDefault();
      return false;
    }
  });

  // Disable dragging (prevents drag-to-inspect tricks)
  document.addEventListener('dragstart', function (e) {
    e.preventDefault();
    return false;
  });

  /* ============================================================
     Original validator logic (unchanged)
     ============================================================ */
  const REG_NO_COL = 0;
  let titleCol = 1, nameCol = 2, nicCol = 3;
  const editableCols = [titleCol, nameCol, nicCol];
  const allowedTitles = ['Mr.', 'Ms.', 'Miss', 'Mrs.', 'Rev.', 'Ven.', 'St.', 'Dr.', 'Prof.', 'Sis.'];

  const REQUIRED_HEADERS = ['reg no', 'title', 'name with initials', 'nic number'];

  const nameRegex = /^((?:[A-Z]\.\s)+)?([A-Z][a-zjk]+(?:\s[A-Z][a-zjk]+)*)$/;

  function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    if (isNaN(d)) return '';
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
  }

  function validateTitle(val) {
    const trimmed = val.trim();
    return allowedTitles.includes(trimmed);
  }

  function validateName(val) {
    const trimmed = val.trim();
    if (trimmed.length < 2) return false;
    return nameRegex.test(trimmed);
  }

  function validateNic(val) {
    const cleanVal = val.replace(/^'+/, '').trim();
    const isOldNIC = /^\d{9}[VX]$/.test(cleanVal);
    const isNewNIC = /^\d{12}$/.test(cleanVal);
    return isOldNIC || isNewNIC;
  }

  const prevValidityMap = new WeakMap();

  function validateCell(cell, colIndex) {
    const val = cell.textContent.trim();
    if (colIndex === titleCol) return validateTitle(val);
    if (colIndex === nameCol) return validateName(val);
    if (colIndex === nicCol) return validateNic(val);
    return true;
  }

  function validateAll() {
    const table = document.getElementById('excelTable');
    let errorCount = 0;
    Array.from(table.rows).slice(1).forEach(row => {
      Array.from(row.cells).forEach((cell, colIndex) => {
        if (editableCols.includes(colIndex)) {
          const valid = validateCell(cell, colIndex);
          const prevValid = prevValidityMap.get(cell);
          if (!valid) {
            cell.classList.add('invalid');
            cell.classList.remove('corrected');
            errorCount++;
            prevValidityMap.set(cell, false);
          } else {
            if (prevValid === false) {
              cell.classList.remove('invalid');
              cell.classList.add('corrected');
            } else {
              cell.classList.remove('invalid');
            }
            prevValidityMap.set(cell, true);
          }
        }
      });
    });

    const msgDiv = document.getElementById('errorMessage');
    const downloadBtn = document.getElementById('downloadExcel');
    if (errorCount > 0) {
      msgDiv.style.display = 'block';
      msgDiv.textContent = `🔴 Please correct ${errorCount} invalid entr${errorCount > 1 ? 'ies' : 'y'} to enable download.`;
      downloadBtn.style.display = 'none';
    } else {
      msgDiv.style.display = 'none';
      downloadBtn.style.display = 'inline-block';
    }
  }

  function checkMetadataFilled() {
    const fields = ['startDate', 'endDate', 'filePrefix', 'fileSuffix', 'hours', 'medium'];
    const venue = getVenue();
    const filled = fields.every(id => document.getElementById(id).value.trim() !== '') && venue !== '';
    document.getElementById('excelFile').disabled = !filled;
  }

  function getVenue() {
    const selected = document.getElementById('venueSelect').value;
    if (selected === 'other') {
      return document.getElementById('venueManual').value.trim();
    }
    return selected;
  }

  document.querySelectorAll('#startDate, #endDate, #filePrefix, #fileSuffix, #hours, #medium').forEach(el => {
    el.addEventListener('input', checkMetadataFilled);
    el.addEventListener('change', checkMetadataFilled);
  });

  document.getElementById('venueSelect').addEventListener('change', () => {
    const showManual = document.getElementById('venueSelect').value === 'other';
    document.getElementById('venueManual').classList.toggle('d-none', !showManual);
    checkMetadataFilled();
  });

  document.getElementById('venueManual').addEventListener('input', checkMetadataFilled);

  function showHeaderError(detailHtml) {
    const box = document.getElementById('headerErrorBox');
    const detail = document.getElementById('headerErrorDetail');
    detail.innerHTML = detailHtml;
    box.style.display = 'block';

    document.getElementById('excelTable').classList.add('d-none');
    document.getElementById('errorMessage').style.display = 'none';
    document.getElementById('downloadExcel').style.display = 'none';
  }

  function hideHeaderError() {
    document.getElementById('headerErrorBox').style.display = 'none';
  }

  function findValidHeaderRow(data) {
    for (let i = 0; i < data.length; i++) {
      const row = data[i] || [];
      if (row.length < REQUIRED_HEADERS.length) continue;
      const matches = REQUIRED_HEADERS.every((expected, idx) => normalizeHeader(row[idx]) === expected);
      if (matches) return { rowIndex: i, headers: row };
    }
    return null;
  }

  function renderTable(headers, rows) {
    const table = document.getElementById('excelTable');
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');
    thead.innerHTML = '';
    tbody.innerHTML = '';

    const headerRow = document.createElement('tr');
    headers.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    rows.forEach(row => {
      if (row.every(cell => cell === null || cell === undefined || cell === '')) return;

      const tr = document.createElement('tr');
      headers.forEach((_, i) => {
        const td = document.createElement('td');
        td.textContent = row[i] ?? '';
        if (editableCols.includes(i)) td.setAttribute('contenteditable', 'true');
        if (!validateCell(td, i)) td.classList.add('invalid');
        prevValidityMap.set(td, validateCell(td, i));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.classList.remove('d-none');
    validateAll();
  }

  document.getElementById('excelFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    hideHeaderError();

    const reader = new FileReader();
    reader.onload = evt => {
      let data;
      try {
        const workbook = XLSX.read(evt.target.result, { type: 'binary' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        data = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      } catch (err) {
        showHeaderError('The uploaded file could not be read as a valid Excel file.');
        e.target.value = '';
        return;
      }

      const match = findValidHeaderRow(data);

      if (!match) {
        showHeaderError(
          `The first 4 columns of the sheet must be exactly, in order:<br>
           <ul>
             <li><strong>Reg No</strong></li>
             <li><strong>Title</strong></li>
             <li><strong>Name with initials</strong></li>
             <li><strong>NIC Number</strong></li>
           </ul>
           This structure was not found anywhere in the uploaded file.`
        );
        e.target.value = '';
        return;
      }

      titleCol = 1;
      nameCol = 2;
      nicCol = 3;
      editableCols.length = 0;
      editableCols.push(titleCol, nameCol, nicCol);

      renderTable(match.headers, data.slice(match.rowIndex + 1));
    };
    reader.readAsBinaryString(file);
  });

  document.getElementById('excelTable').addEventListener('input', e => {
    const cell = e.target;
    if (cell.tagName !== 'TD') return;
    const colIndex = cell.cellIndex;
    if (editableCols.includes(colIndex)) {
      const wasInvalid = cell.classList.contains('invalid');
      const valid = validateCell(cell, colIndex);

      if (valid) {
        if (wasInvalid) {
          cell.classList.remove('invalid');
          cell.classList.add('corrected');
        }
      } else {
        cell.classList.add('invalid');
        cell.classList.remove('corrected');
      }
      prevValidityMap.set(cell, valid);
      validateAll();
    }
  });

  document.getElementById('downloadExcel').addEventListener('click', () => {
    const startDate = formatDate(document.getElementById('startDate').value);
    const endDate = formatDate(document.getElementById('endDate').value);
    const venue = getVenue();
    const prefix = document.getElementById('filePrefix').value.trim();
    const suffix = document.getElementById('fileSuffix').value.trim();
    const hours = document.getElementById('hours').value;
    const medium = document.getElementById('medium').value;
    const fullFileNumber = `${prefix}${hours}${medium}-${suffix}`;

    const metadataRows = [
      ["Start Date", startDate],
      ["End Date", endDate],
      ["Venue", venue],
      ["File Number", fullFileNumber],
      []
    ];

    const table = document.getElementById('excelTable');
    const rows = Array.from(table.querySelectorAll('tr')).filter(r => r.style.display !== 'none');
    const dataRows = rows.map(r => {
      return Array.from(r.cells).map((td, colIndex) => {
        let val = td.textContent.trim();
        if (colIndex === nicCol) {
          val = val.replace(/^'+/, '');
          if (/^\d{12}$/.test(val)) val = `'${val}`;
        }
        return val;
      });
    });

    const finalData = [...metadataRows, ...dataRows];
    const ws = XLSX.utils.aoa_to_sheet(finalData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Corrected");

    XLSX.writeFile(wb, `${fullFileNumber.replace(/[\\/:"*?<>|]+/g, '_')}.xlsx`);
  });

  checkMetadataFilled();

</script>

</body>
</html>
